<header class="navbar-container">
  <div class="navbar-main">
    <a href="/" class="logo">VibePass<span>.</span></a>

    <form action="/api/events/search" method="GET" class="search-form">
      <input type="text" name="search" placeholder="Buscar..." class="search-input" required>
      <button type="submit" class="search-btn">
        <svg class="icon-fluid" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </button>
    </form>

    <div class="navbar-right-group">
      <nav class="nav-links">
        <a href="/conciertos" class="nav-item">Conciertos</a>
        <a href="/deportes" class="nav-item">Deportes</a>
        <a href="/teatro" class="nav-item">Teatro</a>
      </nav>

      <div class="account-menu" (click)="toggleDropdown($event)">
        <div class="account-trigger">
          <svg class="icon-fluid" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <span class="nav-item-text">Mi Cuenta</span>
        </div>
        <div class="dropdown-box" [class.active]="isDropdownOpen">
          <a href="/perfil">Mi Perfil</a>
          <a href="/mis-boletos">Mis Boletos</a>
          <a href="/configuracion">Ajustes</a>
          <a href="/logout" class="logout">Cerrar Sesión</a>
        </div>
      </div>
    </div>

  </div>
</header>

<div class="sub-navbar">
  <div class="sub-container">
    <div class="sub-links">
      <a href="/musica" class="sub-item">Música</a>
      <a href="/familiares" class="sub-item">Familiares</a>
      <a href="/festivales" class="sub-item">Festivales</a>
      <a href="/ayuda" class="sub-item">Ayuda</a>
    </div>

    <div class="location-picker">
      <svg class="icon-fluid" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <span>Tu Ciudad</span>
    </div>
  </div>
</div>
